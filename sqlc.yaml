version: "2"
sql:
  - engine: "postgresql"
    queries: "query/"
    schema: "schema/schema.sql"
    gen:
      go:
        package: "db"
        out: "repo/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
